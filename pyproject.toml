[project]
name = "led-fire-place"
version = "0.1.0"
description = "Tools for sampling and cropping frames from YouTube video for the LED fireplace simulation."
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "yt-dlp",
    "numpy",
    "pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["video_utils", "extract_frames", "generate_led_frames"]
