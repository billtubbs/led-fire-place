[project]
name = "led-fire-place"
version = "0.1.0"
description = "LED fireplace frame sequences for the display1593 LED display, generated with gen-video-frames."
requires-python = ">=3.10"
# Also needs gen-video-frames and display1593, installed from the sibling
# repos (see README.md Setup).
dependencies = [
    "numpy",
    "opencv-python",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "analyse_video",
    "extract_frames",
    "generate_led_frames",
]
